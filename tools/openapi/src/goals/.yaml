get:
  summary: 目標の一覧取得
  tags:
    - API0040
  security:
    - bearerAuth: []
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                goalId:
                  type: integer
                title:
                  type: string
                content:
                  type: string
              required:
                - goalId
                - title
                - content
post:
  summary: 目標の新規作成
  tags:
    - API0041
  security:
    - bearerAuth: []
  requestBody:
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              content:
                type: string
            required:
              - title
              - content
    required: true
  responses:
    "201":
      description: Created
put:
  summary: 目標の更新
  tags:
    - API0042
  security:
    - bearerAuth: []
  requestBody:
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              goalId:
                type: integer
              title:
                type: string
              content:
                type: string
            required:
              - goalId
              - title
              - content
    required: true
  responses:
    "200":
      description: OK
delete:
  summary: 目標の削除
  tags:
    - API0043
  security:
    - bearerAuth: []
  requestBody:
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              goalId:
                type: integer
            required:
              - goalId
    required: true
  responses:
    "200":
      description: OK