get:
  summary: 評価項目の一覧取得
  tags:
    - API0020
  security:
    - bearerAuth: []
  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: array
            items:
              type: object
              properties:
                assessmentItemId:
                  type: integer
                name:
                  type: string
              required:
                - assessmentItemId
                - name
post:
  summary: 評価項目の新規作成
  tags:
    - API0021
  security:
    - bearerAuth: []
  requestBody:
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
            required:
              - name
    required: true
  responses:
    "204":
      description: Created
put:
  summary: 評価項目の更新
  tags:
    - API0022
  security:
    - bearerAuth: []
  requestBody:
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              assessmentItemId:
                type: integer
              name:
                type: string
            required:
              - assessmentItemId
              - name
    required: true
  responses:
    "204":
      description: No Content
delete:
  summary: 評価項目の削除
  tags:
    - API0023
  security:
    - bearerAuth: []
  requestBody:
    content:
      application/json:
        schema:
          type: array
          items:
            type: object
            properties:
              assessmentItemId:
                type: integer
            required:
              - assessmentItemId
    required: true
  responses:
    "204":
      description: No Content