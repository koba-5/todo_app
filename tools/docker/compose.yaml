x-flyway: &flyway
  image: flyway/flyway:11.10.0
  volumes:
    - ./flyway/migrations:/flyway/migrations
    - ./flyway/conf:/flyway/conf

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
  flyway-clean:
    container_name: flyway-clean
    <<: *flyway
    command: clean
  flyway-migrate:
    container_name: flyway-migrate
    <<: *flyway
    command: migrate
  flyway-info:
    container_name: flyway-info
    <<: *flyway
    command: info
