[package]
name = "web"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9" }
async-trait = { version = "0.1.92" }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "time"] }
time = { version = "0.3.55", features = ["serde", "parsing"] }
tokio = { version = "1.54.1", features = ["full"] }
