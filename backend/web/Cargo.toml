[package]
name = "web"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = { version = "0.1.92" }
axum = { version = "0.8.9" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio"] }
time = { version = "0.3.55" }
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3" }
log = "0.4.35"
