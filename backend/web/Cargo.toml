[package]
name = "web"
version = "0.1.0"
edition = "2024"

[dependencies]
time = { version = "0.3.55" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154" }
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-rustls", "macros"] }
axum = { version = "0.8.9" }
tokio = { version = "1.53.3", features = ["full"] }
